<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login - Mundo Aroma</title>
<style>
    :root{
        --bg1:#0f1724;
        --bg2:#1f2937;
        --card:#0b1220;
        --accent:#d4af37;
        --muted:#b8a76a;
        --radius:14px;
        --glass: rgba(212,175,55,0.06);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html,body{height:100%;margin:0;}
    body{
        background: linear-gradient(120deg,var(--bg1),var(--bg2));
        animation: bgmove 12s linear infinite;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#f5e6c4;
        background-size:200% 200%;
    }
    @keyframes bgmove{
        0%{background-position:0% 50%;}
        50%{background-position:100% 50%;}
        100%{background-position:0% 50%;}
    }
    .card{
        width:360px;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.2));
        border-radius: var(--radius);
        padding:28px;
        box-shadow: 0 10px 30px rgba(2,6,23,0.6), 0 2px 6px rgba(0,0,0,0.6);
        border: 1px solid rgba(212,175,55,0.12);
        backdrop-filter: blur(6px);
    }
    h2{margin:0 0 12px 0;font-size:1.3rem;letter-spacing:0.3px}
    p.subtitle{margin:0 0 18px 0;color:var(--muted);font-size:0.9rem}
    form{display:flex;flex-direction:column;gap:12px}
    label{font-size:0.85rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
    input[type="email"], input[type="password"]{
        padding:10px 12px;
        border-radius:10px;
        border:1px solid rgba(255,255,255,0.06);
        background: rgba(255,255,255,0.02);
        color: #fff;
        outline:none;
        transition: box-shadow .18s, transform .08s;
    }
    input:focus{box-shadow: 0 6px 18px rgba(0,0,0,0.6); transform: translateY(-2px);}
    .msg{font-size:0.82rem;color:#ffbaba;background:rgba(255,90,90,0.06);padding:8px;border-radius:8px}
    .msg.ok{color:#c8ffd6;background:rgba(36,166,85,0.06)}
    .error{color:#ffbaba;font-size:0.82rem;margin-top:4px}
    button[type="submit"]{
        margin-top:6px;
        padding:12px;
        background:linear-gradient(90deg,var(--accent),#f5d77a);
        color:#000;border:0;border-radius:10px;font-weight:800;cursor:pointer;
        box-shadow:0 10px 24px rgba(212,175,55,0.14);
    }
    .small{font-size:0.82rem;color:var(--muted);text-align:center;margin-top:10px}
    .invalid{border-color:#ff6b6b; box-shadow: 0 6px 18px rgba(255,107,107,0.06) !important;}
    .valid{border-color:#48c774; box-shadow: 0 6px 18px rgba(72,199,116,0.06) !important;}
    a.link{color:var(--accent);text-decoration:none;font-weight:700}
    @media (max-width:420px){
        .card{width:92%;padding:18px}
    }
</style>
</head>
<body>
    <div class="card" role="region" aria-label="Formulario de inicio de sesión">
        <h2>Iniciar sesión</h2>
        <p class="subtitle">Accede con tu email y contraseña.</p>

        <form id="loginForm" novalidate>
            <label>
                Email
                <input id="email" type="email" autocomplete="username" required placeholder="tucorreo@ejemplo.com">
                <div id="emailError" class="error" aria-live="polite" style="display:none"></div>
            </label>

            <label>
                Contraseña
                <input id="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña">
                <div id="passError" class="error" aria-live="polite" style="display:none"></div>
            </label>

            <button type="submit">Entrar</button>

            <div id="result" role="status" aria-live="polite" style="display:none;margin-top:12px"></div>

            <div class="small">
                ¿No tienes cuenta? <a class="link" href="index_registro.html">Regístrate</a>
            </div>
        </form>
    </div>

<script>
    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passError = document.getElementById('passError');
    const result = document.getElementById('result');

    const EMAIL_REGEX = /^[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i;

    function setInvalid(input, element, msg){
        input.classList.remove('valid'); input.classList.add('invalid');
        element.style.display='block'; element.textContent = msg;
    }
    function setValid(input, element){
        input.classList.remove('invalid'); input.classList.add('valid');
        element.style.display='none'; element.textContent = '';
    }
    function validateEmail(){
        const v = email.value.trim();
        if(!v){ setInvalid(email,emailError,'El email es obligatorio.'); return false;}
        if(!EMAIL_REGEX.test(v)){ setInvalid(email,emailError,'Formato de email inválido.'); return false;}
        setValid(email,emailError); return true;
    }
    function validatePassword(){
        const v = password.value;
        if(!v){ setInvalid(password,passError,'La contraseña es obligatoria.'); return false;}
        setValid(password,passError); return true;
    }

    email.addEventListener('input', () => { validateEmail(); clearResult(); });
    password.addEventListener('input', () => { validatePassword(); clearResult(); });

    form.addEventListener('submit', function(e){
        e.preventDefault();
        const okE = validateEmail();
        const okP = validatePassword();
        if(!(okE && okP)){ showResult('Corrige los errores antes de continuar.', false); return; }

        // Buscar credenciales guardadas (registro debe guardar estos items en localStorage)
        const storedEmail = localStorage.getItem('mundoAroma_email');
        const storedPass = localStorage.getItem('mundoAroma_password');

        if(!storedEmail || !storedPass){
            showResult('No existe una cuenta registrada en este navegador. Regístrate primero.', false);
            return;
        }

        if(email.value.trim() !== storedEmail || password.value !== storedPass){
            showResult('Email o contraseña incorrectos.', false);
            return;
        }

        showResult('Ingreso exitoso. Bienvenido!', true);

        // Ejemplo: redirigir a "dashboard" simulado tras 900ms
        setTimeout(() => {
            // Aquí cambiar a la página real de la aplicación
            window.location.href = 'dashboard.html';
        }, 900);
    });

    function showResult(text, success){
        result.style.display='block';
        result.textContent = text;
        result.className = success ? 'msg ok' : 'msg';
    }
    function clearResult(){
        result.style.display='none';
        result.textContent=''; result.className = '';
    }

    // Detectar llegada desde el registro: la página de registro puede redirigir con ?registered=1
    (function handlePostRegister(){
        const params = new URLSearchParams(location.search);
        if(params.get('registered') === '1'){
            // Si el registro pasó el email por localStorage, rellenar
            const e = localStorage.getItem('mundoAroma_email');
            if(e) email.value = e;
            showResult('Registro exitoso. Por favor inicia sesión.', true);
            // limpiar indicador si existe
            localStorage.removeItem('mundoAroma_justRegistered');
        }
    })();

    // Prefill email si existe
    (function prefill(){
        const e = localStorage.getItem('mundoAroma_email');
        if(e) email.value = e;
    })();
</script>
</body>
</html>
